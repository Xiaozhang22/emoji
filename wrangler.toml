name = "emoji-gen-api"
main = "src/worker.js"
compatibility_date = "2024-01-01"

# 绑定 KV (需要你先在 Cloudflare 后台或命令行创建)
# 运行: npx wrangler kv:namespace create "EMOJI_DATA"
# 然后把输出的 id 填入下面
kv_namespaces = [
  { binding = "EMOJI_KV", id = "YOUR_KV_NAMESPACE_ID" }
]

[vars]
# 你的 ModelScope Token (可以在这里写，也可以在后台加密环境变量里配)
# 建议在后台配置为加密变量: npx wrangler secret put MODELSCOPE_API_KEY
MODELSCOPE_API_KEY = "YOUR_MODELSCOPE_TOKEN_HERE"
