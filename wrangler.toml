name = "emoji-gen-api"
main = "src/worker.js"
compatibility_date = "2024-01-01"

# 绑定 KV 
# [注意] 如果你已经创建了 KV 并且想开启鉴权功能:
# 1. 取消下面几行的注释
# 2. 将 id 替换为你真实的 KV Namespace ID
# 3. 去 src/worker.js 里取消相关代码的注释

# kv_namespaces = [
#   { binding = "EMOJI_KV", id = "YOUR_KV_NAMESPACE_ID" }
# ]

[vars]
# 你的 ModelScope Token
# [重要] 生产环境建议在 Cloudflare 后台 Settings -> Variables and Secrets 里配置
# 为了避免部署报错，这里不再写占位符，请务必去后台添加名为 MODELSCOPE_API_KEY 的加密变量。